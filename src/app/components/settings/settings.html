<div class="container">
  <a routerLink="/videos" class="back">&larr; Back to Library</a>
  <h1>Settings</h1>

  @if (saved()) {
    <div class="saved-toast">Saved</div>
  }

  <div class="form-group">
    <label for="theme">Theme</label>
    <select id="theme" [ngModel]="theme()" (ngModelChange)="theme.set($event)">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
  </div>

  <div class="form-group">
    <label class="checkbox-row">
      <input type="checkbox" [ngModel]="animeSpeedUp()" (ngModelChange)="animeSpeedUp.set($event)" />
      Anime speed-up
    </label>
  </div>

  <button (click)="save()" class="btn btn-primary">Save</button>
</div>
