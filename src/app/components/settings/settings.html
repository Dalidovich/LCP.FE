@let s = settings();

<div class="container">
  <a routerLink="/videos" class="back">&larr; Back to Library</a>
  <h1>Settings</h1>

  @if (saved()) {
    <div class="saved-toast">Saved</div>
  }

  @if (s) {
    <div class="form-group">
      <label for="theme">Theme</label>
      <select id="theme" [ngModel]="s.theme" (ngModelChange)="update('theme', $event)">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>

    <div class="form-group">
      <label class="checkbox-row">
        <input type="checkbox" [ngModel]="s.animeSpeedUp" (ngModelChange)="update('animeSpeedUp', $event)" />
        Anime speed-up
      </label>
    </div>

    <div class="form-group">
      <label class="checkbox-row">
        <input type="checkbox" [ngModel]="s.warmCache" (ngModelChange)="update('warmCache', $event)" />
        Warm cache on startup
      </label>
    </div>

    <div class="form-group">
      <label class="checkbox-row">
        <input type="checkbox" [ngModel]="s.debug" (ngModelChange)="update('debug', $event)" />
        Debug mode
      </label>
    </div>

    <div class="form-group">
      <label class="checkbox-row">
        <input type="checkbox" [ngModel]="s.statisticsMode" (ngModelChange)="update('statisticsMode', $event)" />
        Statistics mode
      </label>
    </div>

    <button (click)="save()" class="btn btn-primary">Save</button>
  }
</div>
